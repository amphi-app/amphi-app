# Runs the tests on every push and pull request, so a change that breaks
# Amphi shows up as a red cross on GitHub before students get it.
#   unit:    the logic (reading ZEUS files, kinds, rooms, friends, updates)
#   browser: Amphi opened on a phone-sized screen and used like a student would
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
