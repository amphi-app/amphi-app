<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZEUS Schedule Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>ZEUS Schedule Viewer</h1>
    <p class="subtitle">Your EPITA timetable, in English, without the six clicks.</p>
  </header>

  <main>
    <section id="upload-section">
      <label class="file-drop" for="ics-input">
        <span id="file-drop-label">Choose your .ics file (from ZEUS → "Générer un ICS")</span>
        <input type="file" id="ics-input" accept=".ics" />
      </label>

      <div class="url-load-row">
        <input type="url" id="ics-url-input" placeholder="…or paste your ZEUS calendar link" />
        <button id="load-url-btn" type="button">Load</button>
      </div>
      <p id="saved-url-note" class="hint" hidden>
        Loaded from your saved link. <button id="forget-url-btn" type="button" class="link-btn">Forget it</button>
      </p>

      <button id="load-sample-btn" type="button">Or try it with a sample schedule</button>
      <p id="error-message" class="error" hidden></p>
    </section>

    <section id="course-picker" hidden>
      <p class="picker-intro">
        This file covers the whole school. Pick the courses you're actually
        enrolled in — your selection is remembered for next time.
      </p>
      <input type="text" id="course-search" placeholder="Search courses…" />
      <div id="course-list"></div>
      <button id="show-schedule-btn" type="button">Show my schedule</button>
    </section>

    <section id="schedule-header" hidden>
      <button id="edit-courses-btn" type="button">← Edit my courses</button>
    </section>

    <section id="legend" hidden>
      <!-- Filled in by app.js once we know which class types are in the file -->
    </section>

    <section id="schedule">
      <!-- Filled in by app.js -->
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
