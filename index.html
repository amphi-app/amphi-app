<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111214" />
  <title>ZEUS Timetable</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>
    <p id="error-message" class="error" hidden></p>

    <section id="upload-section" class="panel">
      <h1>ZEUS Timetable</h1>
      <p class="subtitle">Your EPITA schedule, in English, without the six clicks.</p>

      <label class="file-drop" for="ics-input">
        <span id="file-drop-label">Choose your .ics file (from ZEUS → "Générer un ICS")</span>
        <input type="file" id="ics-input" accept=".ics" />
      </label>

      <div class="url-load-row">
        <input type="url" id="ics-url-input" placeholder="…or paste your ZEUS calendar link" />
        <button id="load-url-btn" type="button">Load</button>
      </div>
      <p id="saved-url-note" class="hint" hidden>
        Loaded from your saved link. <button id="forget-url-btn" type="button" class="link-btn">Forget it</button>
      </p>

      <button id="load-sample-btn" type="button" class="link-btn">Or try it with a sample schedule</button>
    </section>

    <section id="course-picker" class="panel" hidden>
      <p class="picker-intro">
        This file covers the whole school. Pick the courses you're actually
        enrolled in — your selection is remembered for next time.
      </p>
      <input type="text" id="course-search" placeholder="Search courses…" />
      <div id="course-list"></div>
      <button id="show-schedule-btn" type="button" class="primary-btn">Show my schedule</button>
    </section>

    <section id="week-view" hidden>
      <div class="toolbar">
        <button id="edit-courses-btn" type="button" class="link-btn">Edit courses</button>
        <button id="change-source-btn" type="button" class="link-btn">Change source</button>
      </div>

      <header class="day-header">
        <h2 id="day-title"></h2>
        <p id="day-subtitle"></p>
      </header>

      <div class="week-nav">
        <button id="prev-week-btn" type="button" class="icon-btn" aria-label="Previous week">‹</button>
        <span id="week-label"></span>
        <button id="next-week-btn" type="button" class="icon-btn" aria-label="Next week">›</button>
        <button id="today-btn" type="button" class="pill-btn">Today</button>
      </div>

      <nav id="day-tabs" aria-label="Days of the week"></nav>

      <div id="schedule"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
