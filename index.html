<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZEUS Schedule Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>ZEUS Schedule Viewer</h1>
    <p class="subtitle">Your EPITA timetable, in English, without the six clicks.</p>
  </header>

  <main>
    <section id="upload-section">
      <label class="file-drop" for="ics-input">
        <span id="file-drop-label">Choose your .ics file (from ZEUS → "Générer un ICS")</span>
        <input type="file" id="ics-input" accept=".ics" />
      </label>
      <button id="load-sample-btn" type="button">Or try it with a sample schedule</button>
      <p id="error-message" class="error" hidden></p>
    </section>

    <section id="legend" hidden>
      <!-- Filled in by app.js once we know which class types are in the file -->
    </section>

    <section id="schedule">
      <!-- Filled in by app.js -->
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
